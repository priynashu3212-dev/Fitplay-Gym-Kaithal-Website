# Fitplay Gym Kaithal - Backend API (Render Blueprint)
# Deploys the api-server (Express) to Render at no cost (free plan)
# Live URL: https://fitplay-api.onrender.com/api/healthz

services:
  - type: web
    name: fitplay-api
    runtime: node
    repo: https://github.com/priynashu3212-dev/Fitplay-Gym-Kaithal-Website
    branch: main
    plan: free
    region: singapore
    rootDir: ./
    healthCheckPath: /api/healthz
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info